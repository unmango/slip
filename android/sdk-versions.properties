# The Android SDK levels, in one place because four things need them and a
# disagreement between any two of them fails a long way from here: the flake
# composes these platforms and no others, AGP installs a missing one into the
# read-only store and dies, and gomobile refuses to bind against a platform it
# cannot find.
#
# The format is java.util.Properties, because app/build.gradle.kts parses it
# with the JDK and nothing else. nix/shells/android.nix, the Makefile, and
# emulator-test.sh read the same file.
#
# minSdk is the floor that still reaches ordinary phones, and the -androidapi
# gomobile binds against: the .aar is compiled for that NDK sysroot, so a lower
# minSdk links against symbols the device does not have. The NDK accepts 21
# through 35.
minSdk=24
targetSdk=35
compileSdk=35
buildTools=35.0.0
